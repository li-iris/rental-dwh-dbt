# docker compose up --build      -> starts Postgres, then builds the whole warehouse from invented data
services:
  db:
    image: postgres:16
    environment: {POSTGRES_PASSWORD: demo, POSTGRES_DB: rental_dwh}
    ports: ["5433:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 3s, retries: 20}
  runner:
    build: .
    depends_on: {db: {condition: service_healthy}}
    environment: {PGHOST: db, PGUSER: postgres, PGPASSWORD: demo, PGDATABASE: rental_dwh}
    volumes: ["./reports:/app/reports", "./docs_site:/app/docs_site"]
