version: 2

models:
  - name: stg_water_bill
    description: "One row per water bill (property x billing period), address carried down, dates parsed."
    columns:
      - name: water_bill_id
        data_tests: [unique, not_null]

  - name: stg_utility_bill
    description: "One row per electricity / gas bill line."
    columns:
      - name: utility_bill_id
        data_tests: [unique, not_null]

  - name: stg_moving_job
    description: "One row per moving job. The date has no year unless the sheet gives a full date."
    columns:
      - name: moving_job_id
        data_tests: [unique, not_null]

  - name: stg_moving_job_item
    description: "One row per (moving job, item type) with a count."
    columns:
      - name: moving_job_id
        data_tests: [not_null]
      - name: item_code
        data_tests: [not_null]
