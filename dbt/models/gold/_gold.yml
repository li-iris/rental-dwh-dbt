version: 2

models:
  - name: dim_property
    columns:
      - name: property_id
        data_tests: [unique, not_null]
  - name: dim_room
    columns:
      - name: room_id
        data_tests: [unique, not_null]
      - name: property_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_property')
                field: property_id
  - name: fact_rent_credit
    columns:
      - name: credit_id
        data_tests: [unique, not_null]
      - name: property_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_property')
                field: property_id
