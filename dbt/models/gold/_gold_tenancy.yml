version: 2

models:
  - name: dim_tenancy
    description: "One row per tenant per lease, de-duplicated across workbook versions."
    columns:
      - name: tenancy_id
        data_tests: [unique, not_null]
      - name: property_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_property')
                field: property_id
