name: docs
on:
  push: {branches: [main]}
permissions: {contents: read, pages: write, id-token: write}
jobs:
  publish:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: demo, POSTGRES_DB: rental_dwh}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: demo
      PGDATABASE: rental_dwh
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
      DBT_ENGINE_MANAGE_STATE: "0"
    environment: {name: github-pages}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.10", cache: pip}
      - run: pip install -r requirements.txt
      - run: |
          python scripts/gen_synthetic.py raw_private
          SKIP_BACKUP=1 bash scripts/run_all.sh
          mkdir -p docs_site
          python scripts/build_dashboard.py docs_site/dashboard.html
          (cd dbt && dbt docs generate --static && cp target/static_index.html ../docs_site/index.html)
      - uses: actions/upload-pages-artifact@v3
        with: {path: docs_site}
      - uses: actions/deploy-pages@v4
