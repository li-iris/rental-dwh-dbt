name: ci
on: [push, pull_request]
jobs:
  warehouse:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: demo, POSTGRES_DB: rental_dwh}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: demo
      PGDATABASE: rental_dwh
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
      DBT_ENGINE_MANAGE_STATE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.10", cache: pip}
      - run: pip install -r requirements.txt
      - name: Unit tests (pytest)
        run: python -m pytest tests -q
      - name: Invent data, load it, build, test
        run: |
          python scripts/gen_synthetic.py raw_private
          SKIP_BACKUP=1 bash scripts/run_all.sh
      - name: Privacy scan of the repository
        run: bash scripts/privacy_check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-output
          path: |
            logs/
            reports/
