<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">Architecture of the rental data warehouse</title>
<desc id="d">Excel sheets and direct entry load into PostgreSQL bronze, silver and gold layers with dbt tests; gold tables are exported to CSV and published to Snowflake RAW, STAGING and MARTS; GitHub Actions runs tests, the pipeline and an Airflow DAG.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475467"/></marker>
</defs>
<rect width="980" height="470" rx="12" fill="#ffffff" stroke="#d0d5dd"/>
<text x="24" y="34" font-size="18" font-weight="700" fill="#1d2433">Rental data warehouse: how the data flows</text>
<text x="24" y="54" font-size="12" fill="#667085">Cleaning stays in PostgreSQL; finished tables are published to Snowflake. All data shown in this repository is invented.</text>

<!-- inputs -->
<rect x="24" y="96" width="150" height="62" rx="8" fill="#f4f6fa" stroke="#98a2b3"/>
<text x="99" y="122" font-size="14" font-weight="600" text-anchor="middle" fill="#1d2433">Excel workbooks</text>
<text x="99" y="142" font-size="12" text-anchor="middle" fill="#667085">3 files, 18 sheets</text>
<rect x="24" y="178" width="150" height="62" rx="8" fill="#f4f6fa" stroke="#98a2b3"/>
<text x="99" y="204" font-size="14" font-weight="600" text-anchor="middle" fill="#1d2433">Direct entry</text>
<text x="99" y="224" font-size="12" text-anchor="middle" fill="#667085">constraints + audit log</text>

<!-- postgres group -->
<rect x="212" y="78" width="400" height="182" rx="10" fill="#eef4ff" stroke="#2a6df4"/>
<text x="228" y="100" font-size="13" font-weight="700" fill="#1849a9">PostgreSQL + dbt</text>
<rect x="228" y="116" width="106" height="84" rx="8" fill="#ffffff" stroke="#2a6df4"/>
<text x="281" y="142" font-size="14" font-weight="600" text-anchor="middle" fill="#1d2433">bronze</text>
<text x="281" y="162" font-size="11" text-anchor="middle" fill="#667085">every cell as text</text>
<text x="281" y="178" font-size="11" text-anchor="middle" fill="#667085">file hash + row no.</text>
<rect x="352" y="116" width="106" height="84" rx="8" fill="#ffffff" stroke="#2a6df4"/>
<text x="405" y="142" font-size="14" font-weight="600" text-anchor="middle" fill="#1d2433">silver</text>
<text x="405" y="162" font-size="11" text-anchor="middle" fill="#667085">cleaned views</text>
<text x="405" y="178" font-size="11" text-anchor="middle" fill="#667085">rules as seed tables</text>
<rect x="476" y="116" width="120" height="84" rx="8" fill="#ffffff" stroke="#2a6df4"/>
<text x="536" y="142" font-size="14" font-weight="600" text-anchor="middle" fill="#1d2433">gold</text>
<text x="536" y="162" font-size="11" text-anchor="middle" fill="#667085">dim_ / fact_ / rpt_</text>
<text x="536" y="178" font-size="11" text-anchor="middle" fill="#667085">tables</text>
<line x1="334" y1="158" x2="350" y2="158" stroke="#475467" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="458" y1="158" x2="474" y2="158" stroke="#475467" stroke-width="1.6" marker-end="url(#a)"/>
<text x="412" y="224" font-size="12" text-anchor="middle" fill="#1849a9">~60 models, ~230 data tests</text><text x="412" y="242" font-size="11" text-anchor="middle" fill="#1849a9">ERROR stops the run; WARN becomes a follow-up list</text>

<line x1="174" y1="127" x2="226" y2="150" stroke="#475467" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="174" y1="209" x2="226" y2="176" stroke="#475467" stroke-width="1.6" marker-end="url(#a)"/>

<!-- export -->
<rect x="640" y="132" width="92" height="52" rx="8" fill="#fff7e6" stroke="#f79009"/>
<text x="686" y="154" font-size="12" font-weight="600" text-anchor="middle" fill="#1d2433">CSV export</text>
<text x="686" y="171" font-size="11" text-anchor="middle" fill="#667085">PUT + COPY</text>
<line x1="598" y1="158" x2="638" y2="158" stroke="#475467" stroke-width="1.6" marker-end="url(#a)"/>

<!-- snowflake group -->
<rect x="758" y="78" width="198" height="182" rx="10" fill="#ecfdf3" stroke="#12b76a"/>
<text x="772" y="100" font-size="13" font-weight="700" fill="#05603a">Snowflake + dbt</text>
<rect x="772" y="112" width="170" height="38" rx="8" fill="#ffffff" stroke="#12b76a"/>
<text x="857" y="136" font-size="13" font-weight="600" text-anchor="middle" fill="#1d2433">RAW (4 gold tables)</text>
<rect x="772" y="160" width="170" height="38" rx="8" fill="#ffffff" stroke="#12b76a"/>
<text x="857" y="184" font-size="13" font-weight="600" text-anchor="middle" fill="#1d2433">STAGING (4 views)</text>
<rect x="772" y="208" width="170" height="38" rx="8" fill="#ffffff" stroke="#12b76a"/>
<text x="857" y="232" font-size="13" font-weight="600" text-anchor="middle" fill="#1d2433">MARTS (3 reports)</text>
<line x1="857" y1="150" x2="857" y2="158" stroke="#475467" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="857" y1="198" x2="857" y2="206" stroke="#475467" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="732" y1="158" x2="770" y2="132" stroke="#475467" stroke-width="1.6" marker-end="url(#a)"/>

<!-- outputs -->
<rect x="212" y="282" width="400" height="56" rx="8" fill="#f4f6fa" stroke="#98a2b3"/>
<text x="412" y="306" font-size="13" font-weight="600" text-anchor="middle" fill="#1d2433">Outputs for the business</text>
<text x="412" y="324" font-size="12" text-anchor="middle" fill="#667085">Excel problem list  ·  HTML dashboard  ·  run history  ·  dbt docs</text>
<line x1="536" y1="200" x2="536" y2="280" stroke="#475467" stroke-width="1.6" marker-end="url(#a)"/>

<!-- CI -->
<rect x="24" y="364" width="932" height="84" rx="10" fill="#f9fafb" stroke="#d0d5dd" stroke-dasharray="5 4"/>
<text x="40" y="388" font-size="13" font-weight="700" fill="#1d2433">GitHub Actions on every push</text>
<text x="40" y="410" font-size="12" fill="#475467">1. pytest (37 unit tests)   2. invent data, run the whole pipeline, fail on any ERROR test   3. privacy scan of the repository</text>
<text x="40" y="430" font-size="12" fill="#475467">4. Airflow DAG (9 tasks) executed once   5. dbt docs published to GitHub Pages     (the Snowflake build is run by hand, not in CI)</text>
</svg>
